name: Runpod image

on:
  pull_request:
    paths:
      - ".dockerignore"
      - ".github/workflows/runpod-image.yml"
      - "Dockerfile"
      - "README.md"
      - "*.py"
      - "dashboard/**"
      - "ops/runpod/**"
      - "remotion/**"
      - "render-service/**"
      - "requirements*.txt"
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build for pull-request validation
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          target: runpod
          build-args: GPU=1
          load: true
          tags: openshorts-runpod:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the container on pull requests
        env:
          IMAGE: openshorts-runpod:pr-${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          container="openshorts-smoke-${GITHUB_RUN_ID}"
          password="smoke-${GITHUB_RUN_ID}"
          ssh-keygen -q -t ed25519 -N "" -f "$RUNNER_TEMP/runpod-smoke-key"
          cleanup() { docker rm -f "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          docker run --detach --name "$container" \
            --publish 8080:8080 --publish 2222:22 \
            --env OPENSHORTS_AUTH_USER=smoke \
            --env "OPENSHORTS_AUTH_PASSWORD=$password" \
            --env "PUBLIC_KEY=$(cat "$RUNNER_TEMP/runpod-smoke-key.pub")" \
            "$IMAGE"

          ready=false
          for _ in $(seq 1 300); do
            if curl --silent --fail --user "smoke:$password" http://127.0.0.1:8080/ >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            docker logs "$container"
            exit 1
          fi

          docker exec "$container" curl --fail http://127.0.0.1:8000/health/ready
          ssh -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -i "$RUNNER_TEMP/runpod-smoke-key" \
            -p 2222 root@127.0.0.1 true

  publish:
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/openshorts-runpod
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=v0.1.${{ github.run_number }}
            type=ref,event=tag
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          target: runpod
          build-args: GPU=1
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
